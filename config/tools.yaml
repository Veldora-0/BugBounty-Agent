# ==============================================================================
# BugBounty-Agent — Professional Tool Registry
# Machine-readable specification for tool discovery, capabilities, dependencies,
# installation methods, and provider credential requirements.
# ==============================================================================

version: "1.1.0"

tools:
  # ----------------------------------------------------------------------------
  # SUBDOMAIN & ASSET DISCOVERY (CORE)
  # ----------------------------------------------------------------------------
  - name: subfinder
    category: subdomain-enumeration
    binary: subfinder
    tier: CORE
    description: "Fast passive subdomain enumeration tool using multiple public APIs and datasets."
    capabilities:
      - passive-subdomain-discovery
      - asset-discovery
    fallback: amass
    platforms: [linux, darwin, windows]
    install:
      preferred: official-release
      apt_package: subfinder
      go_package: "github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest"
      release_repo: "projectdiscovery/subfinder"
      auto_install: true
    dependencies: []
    api_key:
      required: false
      optional_providers: true
      env_vars: [PDCP_API_KEY]
      docs_path: docs/tools/subfinder.md
    official_url: "https://github.com/projectdiscovery/subfinder"
    documentation_url: "https://docs.projectdiscovery.io/tools/subfinder"
    verify:
      command: "subfinder -version"
      min_version: "2.6.0"
    security_notes: "Passive queries only. Does not generate target traffic unless configured."

  - name: amass
    category: asset-discovery
