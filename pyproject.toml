[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bugbounty-agent"
version = "1.1.0"
description = "Autonomous, hypothesis-driven bug bounty research orchestrator and security toolchain."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "BugBounty-Agent Contributors" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pyyaml>=6.0.1",
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.40.0",
]
dev = [
    "pytest>=8.0.0",
]
all = [
    "playwright>=1.40.0",
    "pytest>=8.0.0",
]

[project.urls]
Homepage = "https://github.com/Veldora-0/BugBounty-Agent"
Repository = "https://github.com/Veldora-0/BugBounty-Agent.git"

[tool.setuptools.packages.find]
where = ["."]
include = ["framework*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
